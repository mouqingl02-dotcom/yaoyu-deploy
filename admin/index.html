<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑶屿商品管理</title><link rel="stylesheet" href="/style.css"><style>body{padding:20px}.wrap{max-width:900px;margin:auto;background:white;padding:25px}form{display:grid;gap:12px}input,textarea,select{padding:12px;border:1px solid #ddd;font:inherit}textarea{min-height:80px}.item{padding:14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:15px}.warn{background:#fff4dd;padding:12px}</style></head><body><div class="wrap"><a href="/">← 返回网站</a><h1>瑶屿｜商品管理</h1><p class="warn">管理端需要设置管理员口令。首次部署前，请在 Netlify 环境变量中配置 ADMIN_PASSWORD。图片建议使用压缩后的 JPG/WEBP。</p><form id="form"><input name="name" placeholder="产品名称" required><select name="category"><option>皮具</option><option>手机壳</option><option>数码配件</option><option>其他</option></select><textarea name="description" placeholder="产品介绍"></textarea><input name="price" placeholder="价格 / 欢迎询价"><input name="moq" placeholder="起订量 MOQ"><input name="image" type="file" accept="image/*"><label><input type="checkbox" name="active" checked> 上架展示</label><button class="btn">保存商品</button></form><h2>已录入商品</h2><div id="list"></div></div><script>
const form=document.querySelector('#form'),list=document.querySelector('#list');let items=[];
const headers={'Content-Type':'application/json'};async function refresh(){try{let r=await fetch('/.netlify/functions/products');items=(await r.json()).products||[];list.innerHTML=items.map(p=>`<div class="item"><span><b>${p.name}</b><br><small>${p.category} · ${p.active===false?'已下架':'展示中'}</small></span><span><button onclick="toggle('${p.id}')">上下架</button> <button onclick="del('${p.id}')">删除</button></span></div>`).join('')||'暂无商品'}catch{list.textContent='读取失败，请确认部署和函数配置。'}}
async function save(method,body){const pass=prompt('请输入管理员口令');if(pass===null)return;let r=await fetch('/.netlify/functions/products',{method,headers:{...headers,'x-admin-password':pass},body:JSON.stringify(body)});if(!r.ok){alert('保存失败：请检查口令及部署配置');return false}return true}
form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form),file=f.get('image'),image='';if(file&&file.size){if(file.size>1500000){alert('图片请压缩至1.5MB以内');return}image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}let ok=await save('POST',{name:f.get('name'),category:f.get('category'),description:f.get('description'),price:f.get('price'),moq:f.get('moq'),image,active:f.has('active')});if(ok){form.reset();refresh()}};
window.del=async id=>{if(confirm('确定删除？')){let ok=await save('DELETE',{id});if(ok)refresh()}};window.toggle=async id=>{let p=items.find(x=>x.id===id);let ok=await save('PATCH',{id,active:p.active===false});if(ok)refresh()};refresh();
</script></body></html>
